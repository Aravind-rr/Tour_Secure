services:
  db:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  geofencing:
    build: ./services/geofencing
    ports:
      - "8051:8051"
    volumes:
      - ./services/geofencing/app:/app

  anomaly:
    build: ./services/anomaly
    ports:
      - "8052:8052"

  blockchain:
    build: ./blockchain
    working_dir: /app
    command: bash -lc "npx hardhat node & sleep 5 && npx hardhat run scripts/deploy.ts --network localhost && tail -f /dev/null"
    ports:
      - "8545:8545"
    depends_on:
      - db

  backend:
    build: ./backend
    ports:
      - "8080:4000"
    environment:
      MONGO_URL: mongodb://db:27017/toursecure
      JWT_SECRET: toursecure-dev-secret
      AUTH_COOKIE_NAME: toursecure_token
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SERVER_BASE_URL: http://localhost:8080
      GEOFENCE_URL: http://geofencing:8051
      ANOMALY_URL: http://anomaly:8052
      HARDHAT_RPC: http://blockchain:8545
      PUBLIC_APP_URL: http://localhost:5173
      # AI assistant: export ANTHROPIC_API_KEY before `docker compose up` to enable Claude (offline mode otherwise)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      - db
      - geofencing
      - anomaly
      - blockchain

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
